name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          # Throwaway password for an ephemeral CI container; not a real credential.
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:ci-only-password@localhost:5432/relief_ci
      TEST_DATABASE_URL: postgres://postgres:ci-only-password@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate throwaway secrets
        run: |
          for k in JWT_SECRET PHONE_PEPPER DATA_MASTER_KEY; do
            echo "$k=$(node -e "console.log(require('crypto').randomBytes(32).toString('base64'))")" >> "$GITHUB_ENV"
          done
          echo "SEED_ADMIN_PASSWORD=Ci$(node -e "console.log(require('crypto').randomBytes(9).toString('hex'))")9" >> "$GITHUB_ENV"
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm db:migrate
      - run: pnpm seed
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --filter @relief/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm audit:deps
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report
          path: apps/web/playwright-report
